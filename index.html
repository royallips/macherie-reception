<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Macherie</title>
<style>
  :root{
    --wine:#C23A72;--wine-dark:#8E2552;--gold:#E58AAE;--gold-soft:#F2C4D8;
    --cream:#FFF5F9;--ink:#3A1E2C;--line:#F0D8E3;--gray:#A98B98;--danger:#C0205A;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
    background:var(--cream);color:var(--ink);overflow:hidden;}
  button{font-family:inherit;cursor:pointer;border:none;}

  header{height:58px;display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;background:var(--wine);color:#fff;position:relative;z-index:30;}
  .brand{display:flex;align-items:baseline;gap:9px;}
  .logoImg{height:34px;display:block;}
  .modeToggle{display:flex;background:rgba(0,0,0,.22);border-radius:999px;padding:4px;}
  .modeToggle button{background:transparent;color:rgba(255,255,255,.65);
    padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700;transition:.15s;}
  .modeToggle button.active{background:#fff;color:var(--wine);}
  .fsBtn{background:rgba(0,0,0,.22);color:#fff;width:34px;height:34px;border-radius:50%;
    font-size:17px;line-height:1;margin-left:8px;flex-shrink:0;}
  .headRight{display:flex;align-items:center;}

  main{height:calc(100% - 58px);overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* お客様用 */
  .custBar{display:flex;align-items:center;gap:10px;padding:12px 18px 0;}
  .resetBtn{background:#fff;border:1px solid var(--line);color:var(--wine);font-weight:700;
    font-size:14px;border-radius:10px;padding:9px 16px;}
  .returnZone{margin-left:auto;display:flex;align-items:center;gap:7px;border:2px dashed #D7C7BD;
    color:var(--gray);font-weight:700;font-size:14px;border-radius:12px;padding:9px 18px;transition:.15s;}
  .returnZone .ic{font-size:16px;}
  .returnZone.armed{border-color:var(--gold);color:var(--wine);}
  .returnZone.over{background:var(--wine);border-color:var(--wine);color:#fff;transform:scale(1.05);}

  .grid{display:grid;gap:14px;padding:14px 18px 18px;grid-template-columns:repeat(3,1fr);}
  .card{position:relative;aspect-ratio:595/842;width:100%;border-radius:16px;overflow:hidden;background:#ddd;
    box-shadow:0 4px 14px rgba(58,15,30,.10);transition:transform .12s;border:1px solid rgba(0,0,0,.04);}
  .card:active{transform:scale(.97);}
  .card .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .card .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:64px;font-weight:700;color:rgba(255,255,255,.9);}
  .card .scrim{position:absolute;left:0;right:0;bottom:0;height:42%;
    background:linear-gradient(to top,rgba(20,5,12,.78),transparent);}
  .card .name{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;color:#fff;
    font-size:23px;font-weight:700;letter-spacing:.03em;text-shadow:0 1px 4px rgba(0,0,0,.5);}

  /* トップ：スライドショー（クロスディゾルブ） */
  .topShow{position:relative;width:100%;height:100%;overflow:hidden;background:#000;}
  .topImg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    opacity:0;transition:opacity 4s ease-in-out;}
  .topImg.show{opacity:1;}
  .topShow{touch-action:pan-y;user-select:none;-webkit-user-select:none;}
  .topShow.quick .topImg{transition-duration:.6s;}
  .topImg{-webkit-user-drag:none;pointer-events:none;}

  /* 表示：本日出勤 */
  .card .cname{position:absolute;left:0;right:0;bottom:0;padding:6px 12px 8px;color:#fff;
    font-size:18px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card .ctime{display:block;font-size:11px;font-weight:500;letter-spacing:.02em;
    color:rgba(255,255,255,.75);margin-top:1px;white-space:normal;}
  .card .soldBtn{top:6px;right:6px;font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;z-index:2;
    background:rgba(0,0,0,.18);color:rgba(255,255,255,.55);}
  .card .soldBtn.active{background:rgba(176,48,80,.55);color:rgba(255,255,255,.8);}
  .card .soldMark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:30px;font-weight:900;letter-spacing:.2em;text-shadow:0 2px 8px rgba(0,0,0,.6);}

  /* スタッフ用：4列の選択グリッド */
  .pickWrap{padding:12px 12px 84px;}
  .pickGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .pcard{position:relative;aspect-ratio:595/842;width:100%;border-radius:11px;overflow:hidden;background:#ddd;
    border:2px solid transparent;transition:transform .1s;}
  .pcard:active{transform:scale(.96);}
  .pcard .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .pcard .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:700;color:rgba(255,255,255,.92);}
  .pcard .scrim{position:absolute;left:0;right:0;bottom:0;height:46%;
    background:linear-gradient(to top,rgba(20,5,12,.8),transparent);}
  .pcard .pname{position:absolute;left:0;right:0;bottom:0;padding:4px 8px 5px;color:#fff;
    font-size:14px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.5);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pcard .ptime{display:block;font-size:10px;font-weight:600;opacity:.9;margin-top:1px;letter-spacing:.2px;}
  .pcard.selected{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.5);}
  .pcard .check{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;
    background:var(--gold);color:#3A0F1E;font-size:15px;font-weight:800;display:none;
    align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3);}
  .pcard.selected .check{display:flex;}
  .doneTag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:#1F8A5B;color:#fff;font-size:19px;font-weight:800;
    border-radius:10px;padding:6px 18px;box-shadow:0 2px 8px rgba(0,0,0,.35);}
  .pcard.added{border-color:#1F8A5B;}
  .soldBtn{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;border-radius:7px;
    padding:4px 8px;background:rgba(255,255,255,.85);color:var(--danger);}
  .soldBtn.active{background:var(--danger);color:#fff;}
  .pcard.sold{opacity:.42;}
  .pcard.sold .pname{text-decoration:line-through;}

  .doneBar{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:25;
    box-shadow:0 -4px 16px rgba(58,15,30,.08);}
  .doneBar .cnt{font-size:15px;font-weight:700;color:var(--wine);}
  .doneBar .cnt b{font-size:20px;}
  .doneBar .done{background:var(--wine);color:#fff;border-radius:12px;padding:13px 30px;font-size:16px;font-weight:800;}
  .doneBar .done:disabled{background:#D9CEC8;color:#fff;}

  .chBar{display:flex;justify-content:flex-end;padding:10px 14px 0;}
  .chBar .chBtn{background:#fff;color:var(--wine);border:1.5px solid var(--wine);border-radius:10px;
    padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;}
  .chBar .chBtn.active{background:var(--wine);color:#fff;}
  .chBar .chBtn:disabled{opacity:.5;}
  .inbBadge{position:absolute;top:5px;right:5px;background:var(--gold);color:#fff;
    font-size:9px;font-weight:800;border-radius:5px;padding:2px 5px;line-height:1.2;}
  .checkRow{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .checkRow label{font-size:13px;color:var(--gray);font-weight:600;display:flex;align-items:center;gap:8px;cursor:pointer;}
  .checkRow input[type=checkbox]{width:20px;height:20px;accent-color:var(--wine);cursor:pointer;}
  .inbToggle{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .inbToggle label{font-size:13px;color:var(--gray);font-weight:600;}
  .inbToggle button{padding:8px 18px;border-radius:10px;font-size:13px;font-weight:700;
    border:1.5px solid var(--wine);background:#fff;color:var(--wine);}
  .inbToggle button.on{background:var(--wine);color:#fff;}

  /* 設定：6列グリッド */
  .setWrap{padding:16px 18px 40px;}
  .setHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .setHead h2{font-size:17px;color:var(--wine);margin:0;}
  .setSubHead{display:flex;gap:6px;margin-bottom:14px;}
  .btn{background:var(--wine);color:#fff;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;}
  .btn.ghost{background:#fff;color:var(--wine);border:1px solid var(--line);}
  .btn.sm{font-size:12px;padding:7px 11px;}

  .setGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
  .scard{cursor:pointer;min-width:0;}
  .sthumb{position:relative;aspect-ratio:595/842;width:100%;border-radius:10px;overflow:hidden;background:#ddd;border:1px solid rgba(0,0,0,.04);}
  .sthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .sthumb .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:30px;font-weight:700;}
  .sthumb .soldtag{position:absolute;top:5px;left:5px;background:var(--danger);color:#fff;
    font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;}
  .sname{margin-top:6px;font-size:13px;font-weight:700;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .photoSwitch{display:flex;gap:3px;margin-top:4px;}
  .photoSwitch button{flex:1;padding:3px 0;border:1px solid var(--line);border-radius:5px;
    font-size:11px;font-weight:700;background:#fff;color:var(--gray);}
  .photoSwitch button.active{background:var(--wine);color:#fff;border-color:var(--wine);}
  .empty{color:var(--gray);font-size:14px;padding:14px 2px;}

  /* 全画面ビューア */
  .viewer{position:fixed;inset:0;z-index:70;background:#0E1F18;display:none;align-items:center;justify-content:center;touch-action:none;}
  .viewer.show{display:flex;}
  .viewer img{width:100%;height:100%;object-fit:contain;}
  #viewerBody{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity .15s;}
  #viewerBody.fade{opacity:0;}
  .viewer .vph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;}
  .viewer .vph .big{font-size:120px;font-weight:800;}
  .viewer .vname{position:absolute;bottom:36px;left:0;right:0;text-align:center;color:#fff;
    font-size:30px;font-weight:700;text-shadow:0 2px 10px rgba(0,0,0,.6);letter-spacing:.04em;}
  .viewer .close{position:absolute;top:16px;right:16px;width:46px;height:46px;border-radius:50%;
    background:rgba(255,255,255,.15);color:#fff;font-size:22px;z-index:1;}
  .vSwitch{position:absolute;bottom:16px;right:14px;display:none;gap:5px;z-index:1;}
  .vSwitch button{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.18);
    color:#fff;font-size:11px;font-weight:800;border:1.5px solid rgba(255,255,255,.35);}
  .vSwitch button.active{background:rgba(255,255,255,.82);color:var(--wine);border-color:#fff;}

  /* トースト通知 */
  #syncToast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(30,30,30,.92);color:#fff;font-size:13px;padding:8px 18px;border-radius:20px;
    opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:300;white-space:nowrap;}
  #syncToast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ロック画面 */
  #lockScreen{position:fixed;inset:0;z-index:200;background:var(--wine);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:40px;}
  #lockScreen.hidden{display:none;}
  #lockScreen .lockLogo{height:64px;}
  #lockScreen .lockTitle{color:rgba(255,255,255,.55);font-size:13px;font-weight:600;letter-spacing:.08em;margin-top:-8px;}
  #lockScreen .lockBox{background:rgba(255,255,255,.08);border-radius:18px;padding:28px 28px 24px;width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;}
  #lockScreen .lockBox p{color:#fff;font-size:15px;font-weight:700;text-align:center;margin:0;}
  #lockScreen input[type=password]{width:100%;padding:13px 16px;border-radius:12px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:18px;text-align:center;letter-spacing:.2em;font-family:inherit;}
  #lockScreen input[type=password]::placeholder{letter-spacing:normal;font-size:14px;opacity:.5;}
  #lockScreen input[type=password]:focus{outline:none;border-color:var(--gold);}
  #lockScreen .lockBtn{width:100%;padding:14px;border-radius:12px;background:var(--gold);color:#fff;font-size:16px;font-weight:800;letter-spacing:.04em;}
  #lockScreen .lockErr{color:#f87171;font-size:13px;text-align:center;min-height:18px;}

  /* モーダル */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(20,8,14,.55);display:none;align-items:center;justify-content:center;padding:20px;}
  .modal.show{display:flex;}
  .sheet{background:#fff;border-radius:18px;width:100%;max-width:440px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .sheet h3{margin:0 0 16px;font-size:18px;color:var(--wine);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--gray);margin-bottom:6px;}
  .field input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;}
  .field input:focus{outline:none;border-color:var(--wine);}
  .sheetActs{display:flex;gap:10px;margin-top:8px;}
  .sheetActs button{flex:1;padding:12px;border-radius:10px;font-size:15px;font-weight:700;}
  .sheetActs .cancel{background:#F1ECE7;color:var(--ink);}
  .sheetActs .save{background:var(--wine);color:#fff;}
  .sheetActs .del{background:#fff;border:1px solid #EBB7C5;color:var(--danger);flex:0 0 auto;padding:12px 16px;}
</style>
</head>
<body>

<div id="lockScreen">
  <img class="lockLogo" id="lockLogoImg" src="./img/logo.png?v=2" alt="MaCherie">
  <p class="lockTitle"></p>
  <div class="lockBox">
    <p>パスワードを入力してください</p>
    <input type="password" id="lockInput" placeholder="パスワード" autocomplete="off" onkeydown="if(event.key==='Enter')tryUnlock()">
    <button class="lockBtn" onclick="tryUnlock()">解除</button>
    <div class="lockErr" id="lockErr"></div>
  </div>
</div>

<header>
  <div class="brand"><img class="logoImg" src="./img/logo.png?v=2" alt="MaCherie"></div>
  <div class="headRight">
  <div class="modeToggle">
    <button id="mTop" onclick="setMode('top')">トップ</button>
    <button id="mCustomer" class="active" onclick="setMode('customer')">表示</button>
    <button id="mInbound" onclick="setMode('inbound')">インバウンド</button>
    <button id="mSettings" onclick="setMode('settings')">一覧</button>
  </div>
  <button class="fsBtn" id="fsBtn" onclick="toggleFullscreen()" title="全画面表示">⛶</button>
  </div>
</header>

<main id="main"></main>
<div id="syncToast"></div>
<div class="viewer" id="viewer"
  onpointerdown="viewerPD(event)" onpointerup="viewerPU(event)" onpointercancel="vs=null">
  <button class="close" onclick="closeViewer(event)">✕</button>
  <div id="viewerBody"></div>
  <div id="vSwitch" class="vSwitch"></div>
</div>

<div class="modal" id="editModal">
  <div class="sheet">
    <h3 id="editTitle">キャストを追加</h3>
    <div style="display:flex;gap:16px;align-items:flex-start;margin-bottom:14px;">
      <div id="editPhotoWrap" style="width:90px;flex-shrink:0;aspect-ratio:595/842;border-radius:10px;overflow:hidden;background:#ddd;display:none;cursor:pointer;"
        onclick="openPhotoViewer()">
        <img id="editPhoto" src="" alt="" style="width:100%;height:100%;object-fit:cover;"
          onerror="this.parentNode.style.display='none'">
      </div>
      <div style="flex:1;min-width:0;">
        <div class="field"><label>源氏名</label>
          <input id="fName" type="text" placeholder="" autocomplete="off" oninput="updateEditPhoto()">
          <div id="nameErr" style="display:none;color:var(--danger);font-size:12px;margin-top:5px;">源氏名を入力してください</div></div>
      </div>
    </div>
    <div class="checkRow">
      <label><input type="checkbox" id="fMatt" onchange="toggleFMatt()">マット対応</label>
    </div>
    <div class="field" id="mattMemoWrap" style="display:none">
      <label>対応条件</label>
      <input type="text" id="fMattMemo" placeholder="条件を入力（任意）" maxlength="30">
    </div>
    <div class="inbToggle">
      <label>インバウンド対応</label>
      <span id="fInbInfo" style="font-size:13px;color:var(--gray);">利用表アプリのキャスト編集で設定します</span>
    </div>
    <div class="sheetActs">
      <button class="del" id="editDel" onclick="deleteCast()">削除</button>
      <button class="cancel" onclick="closeEdit()">やめる</button>
      <button class="save" onclick="saveCast()">保存</button>
    </div>
  </div>
</div>

<div class="modal" id="confirmModal">
  <div class="sheet">
    <h3>本当に削除しますか？</h3>
    <p id="confirmName" style="margin:0 0 18px;font-size:15px;line-height:1.6;color:var(--ink);"></p>
    <div class="sheetActs">
      <button class="cancel" onclick="closeConfirm()">やめる</button>
      <button class="save" style="background:var(--danger)" onclick="reallyDelete()">完全削除</button>
    </div>
  </div>
</div>



<script>
let casts = [];          // {id,name,photo,sold}
let mode = 'customer';
let editId = null;
let attendMap = new Map();   // attend.json の本日出勤 源氏名 → {start,end,shiftTime}
let viewMode = 'today';      // 表示タブ: 'today' | 'matt'
const STORE_KEY = 'royal_reception_v2';
const SOLD_DATE_KEY = 'royal_reception_sold_date';
const DELETED_KEY = 'royal_reception_deleted';
const DAY_KEY = 'royal_reception_day';  // その日だけ有効な状態（自動完売済み）
function loadDay(){
  try{ const v=JSON.parse(localStorage.getItem(DAY_KEY)||'null'); if(v&&v.date===todayJST()) return v; }catch(e){}
  return {date:todayJST(),autoSold:[],extraSold:[]};
}
function saveDay(){ try{ localStorage.setItem(DAY_KEY,JSON.stringify(day)); }catch(e){} }
let day;
function getDeletedIds(){ try{ return new Set(JSON.parse(localStorage.getItem(DELETED_KEY)||'[]')); }catch(e){ return new Set(); } }
function addDeletedId(id){ const s=getDeletedIds(); s.add(id); localStorage.setItem(DELETED_KEY,JSON.stringify([...s])); }
const PHOTO_BASE = './img/';   // ページと同じ場所の img フォルダ（ローカル確認でも新しい写真が出る）
// 写真は img/源氏名.jpg（2枚目 源氏名2、3枚目 源氏名3、インバウンド 源氏名A1 / 源氏名A2）
function photoUrl(name,suffix){ return name?PHOTO_BASE+encodeURIComponent(name.normalize('NFC'))+(suffix||'')+'.jpg':''; }
// 写真がないキャストは「COMING SOON」画像（img/noimage.jpg）を表示。next があれば先にそちらを試す
const NO_PHOTO=PHOTO_BASE+'noimage.jpg';
function imgErr(next){
  return next
    ?`onerror="if(this.dataset.f){this.onerror=null;this.src='${NO_PHOTO}'}else{this.dataset.f=1;this.src='${esc(next)}'}"`
    :`onerror="this.onerror=null;this.src='${NO_PHOTO}'"`;
}
function fixPhoto(c){ c.photo=photoUrl(c.name); c.photos=[c.photo]; c.photoIdx=0; delete c.gid; }


function todayJST(){ const d=new Date(Date.now()+9*3600000); return d.toISOString().slice(0,10); }
day=loadDay();
function load(){
  try{
    const v=localStorage.getItem(STORE_KEY);
    if(v){
      casts=JSON.parse(v);
      // 旧データ（girlid時代の初期サンプル id='c'+数字）を除き、写真を源氏名から作り直す
      casts=casts.filter(c=>!/^c\d+$/.test(c.id)||!c.gid||c.id!=='c'+c.gid);
      for(const c of casts) fixPhoto(c);
      // 日付が変わっていたら完売状態をリセット
      const savedDate=localStorage.getItem(SOLD_DATE_KEY)||'';
      if(savedDate!==todayJST()) for(const c of casts) c.sold=false;
      return;
    }
  }catch(e){}
  casts=[];
}
function save(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(casts)); }catch(e){} }

async function syncFromRemote(){
  try{
    const res=await fetch('./casts.json',{cache:'no-store'});
    if(!res.ok) return;
    const remote=await res.json();
    if(!Array.isArray(remote)||remote.length===0) return;
    const localMap=new Map(casts.map(c=>[c.id,c]));
    const deletedIds=getDeletedIds();
    let changed=false;
    for(const rc of remote){
      if(deletedIds.has(rc.id)) continue;
      const local=localMap.get(rc.id);
      // 源氏名で出勤を照合するので、名前もクラウド（casts.json）に合わせる
      if(local){
        const {shown,sold}=local;
        if(local.name!==rc.name) changed=true;
        Object.assign(local,rc,{shown,sold}); fixPhoto(local);
      } else {
        const c={...rc,shown:false,sold:false}; fixPhoto(c); casts.push(c);
        changed=true;
      }
    }
    save(); if(changed) render();
  }catch(e){}
}

// top.jpg, top2.jpg, top3.jpg … を連番で探し、15秒ごとに4秒かけてクロスディゾルブで切り替える
const TOP_HOLD_MS=15000;
let topTimer=null, topImgs=null;
function stopTopSlides(){ clearInterval(topTimer); topTimer=null; }
async function loadTopImages(){
  if(topImgs) return topImgs;
  const all=[];
  for(let i=1;i<=30;i++){
    const u=PHOTO_BASE+(i===1?'top':'top'+i)+'.jpg';
    if(!await new Promise(r=>probePhoto(u,r))) break;   // 番号が途切れたらそこまで
    all.push(u);
  }
  // 利用表アプリで「非表示」にした番号（img/top.json の hidden）は飛ばす
  let hidden=[];
  try{ const r=await fetch(PHOTO_BASE+'top.json?t='+Date.now(),{cache:'no-store'}); if(r.ok) hidden=(await r.json()).hidden||[]; }catch(e){}
  return topImgs=all.filter((u,i)=>!hidden.includes(i+1));
}
function renderTop(){
  document.getElementById('main').innerHTML=`<div class="topShow"></div>`;
  topIdx=0;
  loadTopImages().then(list=>{
    const box=document.querySelector('.topShow');
    if(mode!=='top'||!box||box.children.length) return;
    list.forEach((u,i)=>box.insertAdjacentHTML('beforeend',`<img class="topImg${i?'':' show'}" src="${esc(u)}" alt="">`));
    if(list.length<2||topTimer) return;
    // 左右スワイプで次／前の画像へ（すばやくフェード）
    let sw=null;
    box.addEventListener('pointerdown',e=>{ sw={x:e.clientX,y:e.clientY,id:e.pointerId}; });
    box.addEventListener('pointerup',e=>{
      if(!sw||e.pointerId!==sw.id) return;
      const dx=e.clientX-sw.x, dy=e.clientY-sw.y; sw=null;
      if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) topGo(dx<0?1:-1,true);
    });
    box.addEventListener('pointercancel',()=>{ sw=null; });
    startTopTimer();
  });
}
let topIdx=0;
function startTopTimer(){
  clearInterval(topTimer);
  topTimer=setInterval(()=>topGo(1,false),TOP_HOLD_MS);   // 手で動かした後も、そこから15秒後に再開
}
function topGo(step,quick){
  const box=document.querySelector('.topShow');
  if(!box||!box.isConnected){ stopTopSlides(); return; }
  const imgs=box.querySelectorAll('.topImg'); if(imgs.length<2) return;
  box.classList.toggle('quick',!!quick);
  imgs[topIdx].classList.remove('show');
  topIdx=(topIdx+step+imgs.length)%imgs.length;
  imgs[topIdx].classList.add('show');
  if(quick) startTopTimer();
}

function rosterCasts(){
  const byName=(a,b)=>(a.name||'').localeCompare((b.name||''),'ja');
  if(!rosterSet) return [...casts].sort(byName);
  const seen=new Set(), list=[];
  for(const c of casts) if(rosterSet.has(c.name)&&!seen.has(c.name)){ seen.add(c.name); list.push(c); }
  for(const n of rosterSet) if(!seen.has(n)){ seen.add(n); list.push(extraCast(n)); }
  return list.sort(byName);
}

// 日付が変わったら完売・手動出勤をリセット
function setExtraSold(name,sold){
  const set=new Set(day.extraSold||[]);
  if(sold) set.add(name); else set.delete(name);
  day.extraSold=[...set]; saveDay();
}
function checkNewDay(){
  const t=todayJST();
  if(localStorage.getItem(SOLD_DATE_KEY)!==t){
    for(const c of casts) c.sold=false;
    localStorage.setItem(SOLD_DATE_KEY,t); save();
  }
  if(day.date!==t){ day={date:t,autoSold:[],extraSold:[]}; saveDay(); }
}
// 退勤時間を過ぎたキャストを完売にする（各キャスト1日1回だけ。手動で戻した完売は上書きしない）
function applyAutoSold(){
  const nowJST=new Date(Date.now()+9*3600000);
  const nowMin=nowJST.getUTCHours()*60+nowJST.getUTCMinutes();
  const done=new Set(day.autoSold);
  let changed=false;
  for(const c of [...casts,...sheetOnlyCasts()]){
    const info=attendMap.get(c.name);
    if(!info||done.has(c.name)) continue;
    const end=timeToMin(info.end);   // 24:00（ラスト）は営業終了まで完売にしない
    if(end!==9999&&nowMin>end){
      c.sold=true; done.add(c.name); changed=true;
      if(c.extra) setExtraSold(c.name,true);
    }
  }
  if(changed){ day.autoSold=[...done]; saveDay(); save(); }
}
/* 利用表（ロイヤル利用管理）から直接取得。URL・パスワードはこの端末の localStorage のみに保存 */
const SHEET_URL_KEY='rr_sheet_url', SHEET_PASS_KEY='rr_sheet_pass';
function sheetConf(){ try{ return {url:localStorage.getItem(SHEET_URL_KEY)||'',pass:localStorage.getItem(SHEET_PASS_KEY)||''}; }catch(e){ return {url:'',pass:''}; } }
// '20.5' → '20:30'、L（ラスト）→ '24:00'（scripts/fetch_attendance.py と同じ）
function fmtSheetTime(v){
  const s=String(v??'').trim();
  if(s==='L'||s==='24'||s==='24:00') return '24:00';
  const f=parseFloat(s); if(isNaN(f)) return s;
  const h=Math.floor(f); return h+':'+String(Math.round((f-h)*60)).padStart(2,'0');
}
async function fetchSheetAttendance(){
  const {url,pass}=sheetConf();
  const res=await fetch(url+(url.includes('?')?'&':'?')+'action=get&rev=0&pass='+encodeURIComponent(pass)+'&_t='+Date.now(),{cache:'no-store'});
  let j; try{ j=await res.json(); }catch(e){ throw new Error('URLが正しくない可能性があります'); }
  if(!j.ok) throw new Error(j.error||'利用表の取得に失敗');
  const d=typeof j.data==='string'?JSON.parse(j.data):j.data;
  const today=todayJST();
  const names=new Map((d.casts||[]).map(c=>[c.id,(c.name||'').trim()]));
  const list=[];
  for(const [k,r] of Object.entries(d.records||{})){
    if(!k.endsWith('_'+today)||!r||r._deleted) continue;
    if((r.status!=='work'&&r.status!=='furikae')||!r.start) continue;   // 利用・振替のみ
    if(r.hideNet||r.dummy) continue;                                      // ネット非掲載・ダミーは除外
    const name=names.get(k.slice(0,-today.length-1)); if(!name) continue;
    const st=fmtSheetTime(r.start), en=fmtSheetTime((r.start2?r.end2:r.end)||'L');   // 中抜けは最初〜最後
    list.push({name,start:st,end:en,shiftTime:st+'〜'+en});
  }
  // インバウンド対応（利用表アプリで一度も設定していない間は null → casts.json を使う）
  const cs=d.casts||[];
  const inbound=cs.some(c=>c.inbound!==undefined)
    ?Object.fromEntries(cs.filter(c=>c.inbound).map(c=>[(c.name||'').trim(),c.inbMemo||''])):null;
  const hidden=cs.filter(c=>c.hidePanel).map(c=>(c.name||'').trim());
  const roster=cs.map(c=>(c.name||'').trim()).filter(Boolean);
  const matt=cs.filter(c=>c.mat).map(c=>(c.name||'').trim());
  return {date:today,list,inbound,hidden,roster,matt};
}
async function refreshAttendance(manual){
  const btn=document.getElementById('chSyncBtn');
  if(manual&&btn){ btn.disabled=true; btn.textContent='取得中...'; }
  checkNewDay();
  if(manual) await syncFromRemote();
  try{
    let data=null, sheetErr='';
    const conf=sheetConf();
    if(conf.url&&conf.pass){
      try{ data=await fetchSheetAttendance(); }
      catch(e){ sheetErr=String(e&&e.message||e); console.warn('利用表から取得できず attend.json を使用',e); }
    }
    if(!data){
      const res=await fetch('./attend.json?t='+Date.now(),{cache:'no-store'});
      if(!res.ok) throw new Error();
      data=await res.json();
    }
    const isToday=data.date===todayJST();
    attendMap=new Map(isToday?(data.list||[]).map(x=>[x.name,x]):[]);
    if(data.inbound) inboundMap=new Map(Object.entries(data.inbound));
    if(data.hidden) hiddenSet=new Set(data.hidden);
    if(data.roster&&data.roster.length) rosterSet=new Set(data.roster);
    if(data.matt) mattSet=new Set(data.matt);
    applyAutoSold();
    if(manual){
      const n=casts.filter(isAttending).length;
      if(sheetErr==='auth') alert('利用表のパスワードが違います。\n設定タブの「利用表の接続」を確認してください。');
      else if(sheetErr) alert('利用表から取得できませんでした（'+sheetErr+'）。\n設定タブの「利用表の接続」のURLとネット接続を確認してください。');
      else if(!(conf.url&&conf.pass)&&!isToday) alert('本日分の利用データがまだありません。\n設定タブの「利用表の接続」にURLとパスワードを入れると、更新ボタンで利用表から直接取得できます。');
      else showSyncToast(`利用情報を更新しました（${n}名${conf.url&&conf.pass?'・利用表から取得':''}）`);
    }
  }catch(e){
    if(manual) alert('利用データの取得に失敗しました。\nネットワーク接続を確認してください。');
  }
  if(manual&&btn){ btn.disabled=false; btn.textContent='更新'; }
  if(mode==='customer'||mode==='inbound') render();
}

  try{
    const meta=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,
      {headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}});
    if(!meta.ok) throw new Error(meta.status);

      ({id,name,photo,photos,photoIdx,inbound,inbMemo,matt,mattMemo}));

      method:'PUT',

let g=null;
const MOVE_CANCEL=20;

function attachDnd(){
  document.querySelectorAll('.card[data-id]').forEach(card=>{
    const id=card.getAttribute('data-id');
    card.addEventListener('pointerdown', e=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      if(e.target.closest('button')) return;
      gestureStart(e, id);
    }, {passive:true});
  });
}
function gestureStart(e, id){
  g={id, x0:e.clientX, y0:e.clientY, pid:e.pointerId};
}
function gestureMove(e){
  if(!g || e.pointerId!==g.pid) return;
  if(Math.hypot(e.clientX-g.x0, e.clientY-g.y0)>MOVE_CANCEL) g=null;
}
function gestureEnd(e){
  if(!g || e.pointerId!==g.pid) return;
  const moved=Math.hypot(e.clientX-g.x0, e.clientY-g.y0)>10;
  const id=g.id; g=null;
  if(moved) return;
  showPhoto(id);
}
document.addEventListener('pointermove', gestureMove, {passive:false});
document.addEventListener('pointerup', gestureEnd);
document.addEventListener('pointercancel', e=>{ if(g && e.pointerId===g.pid) g=null; });

const AUTH_KEY='rr_auth_v2';
const PASS_KEY='rr_pass_v2';
const DEFAULT_PASS='macherie123';

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function initLock(){
  // ロゴをlock画面にコピー
  const logo=document.querySelector('.logoImg');
  if(logo) document.getElementById('lockLogoImg').src=logo.src;
  // 保存済みパスハッシュがなければデフォルトを設定
  if(!localStorage.getItem(PASS_KEY)){
    localStorage.setItem(PASS_KEY,await sha256(DEFAULT_PASS));
  }
  // 認証済みチェック
  if(localStorage.getItem(AUTH_KEY)==='1'){
    document.getElementById('lockScreen').classList.add('hidden');
    return;
  }
  // ロック画面表示・アプリ側は非表示
  document.getElementById('lockInput').focus();
}
async function tryUnlock(){
  const input=document.getElementById('lockInput').value;
  if(!input) return;
  const hash=await sha256(input);
  const stored=localStorage.getItem(PASS_KEY)||await sha256(DEFAULT_PASS);
  if(hash===stored){
    localStorage.setItem(AUTH_KEY,'1');
    const ls=document.getElementById('lockScreen');
    ls.style.opacity='0';ls.style.transition='opacity .3s';
    setTimeout(()=>ls.classList.add('hidden'),300);
  } else {
    const err=document.getElementById('lockErr');
    err.textContent='パスワードが違います';
    document.getElementById('lockInput').value='';
    setTimeout(()=>err.textContent='',2000);
  }
}
async function changePassword(current,next){
  const curHash=await sha256(current);
  const stored=localStorage.getItem(PASS_KEY)||await sha256(DEFAULT_PASS);
  if(curHash!==stored) return '現在のパスワードが違います';
  if(next.length<4) return 'パスワードは4文字以上にしてください';
  const newHash=await sha256(next);
  localStorage.setItem(PASS_KEY,newHash);
  // 他の端末にも反映するためGitHubにpush
  await pushPassToGitHub(newHash);
  return null;
}
async function pushPassToGitHub(hash){
  const token=localStorage.getItem(GH_TOKEN_KEY)||'';
  if(!token) return;
  const REPO='royallips/macherie-reception';
  const FILE='app-config.json';
  try{
    let sha='';
    const meta=await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,
      {headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}});
    if(meta.ok){const j=await meta.json();sha=j.sha;}
    const content=btoa(JSON.stringify({passHash:hash}));
    const body={message:'パスワード更新',content};
    if(sha) body.sha=sha;
    await fetch(`https://api.github.com/repos/${REPO}/contents/${FILE}`,{
      method:'PUT',
      headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
  }catch(e){}
}
async function syncPassFromRemote(){
  try{
    const res=await fetch('./app-config.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) return;
    const cfg=await res.json();
    if(cfg.passHash) localStorage.setItem(PASS_KEY,cfg.passHash);
  }catch(e){}
}

function toggleFullscreen(){
  const d=document, el=d.documentElement;
  const isFs=d.fullscreenElement||d.webkitFullscreenElement;
  if(isFs){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
  else { const req=el.requestFullscreen||el.webkitRequestFullscreen; if(req) req.call(el).catch?.(()=>{}); }
}
function updateFsBtn(){
  const b=document.getElementById('fsBtn'); if(!b) return;
  const isFs=document.fullscreenElement||document.webkitFullscreenElement;
  b.textContent=isFs?'✕':'⛶'; b.title=isFs?'全画面を終了':'全画面表示';
}
document.addEventListener('fullscreenchange',updateFsBtn);
document.addEventListener('webkitfullscreenchange',updateFsBtn);

load(); syncPassFromRemote(); initLock().then(()=>{ render(); syncFromRemote(); refreshAttendance(false); });
// 毎日午前7時（日本時間）に1回だけ本日出勤・キャスト情報を取り直す（全画面表示を保つためページの再読み込みはしない）
function scheduleDailyRefresh(){
  const nowJST=Date.now()+9*3600000;
  let next=Math.floor(nowJST/86400000)*86400000+7*3600000;   // 今日の7:00（JST）
  if(next<=nowJST) next+=86400000;
  setTimeout(async()=>{
    checkNewDay(); topImgs=null; await syncFromRemote(); await refreshAttendance(false);
    scheduleDailyRefresh();
  },next-nowJST);
}
scheduleDailyRefresh();
</script>
